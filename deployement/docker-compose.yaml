services:
  liftbeats-api:
    image: segfault13/liftbeats-api:latest
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: liftbeats-api
    restart: unless-stopped
    env_file:
      - ./.env
    expose:
      - "8000"
    volumes:
      - ../media:/app/media

  nginx:
    image: nginx:1.27-alpine
    container_name: liftbeats-nginx
    restart: unless-stopped
    depends_on:
      - liftbeats-api
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
