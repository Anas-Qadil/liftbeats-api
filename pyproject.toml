[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liftbeats-api"
version = "0.1.0"
description = "FastAPI backend for Lift Beats"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.39.0",
    "cryptography>=45.0.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pydantic-settings>=2.10.0",
    "PyJWT>=2.10.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.35.0",
    "yt-dlp>=2025.8.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
